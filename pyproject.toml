[project]
name = "lens"
version = "0.1.0"
description = "LENS — Leading Engagement & Narrative Synthesis"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["services/*", "shared-py/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
